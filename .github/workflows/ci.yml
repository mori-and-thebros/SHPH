# SHPH continuous integration: format, lint, build, and test on Linux + Windows.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
      - name: cargo fmt --check
        run: cargo +1.96.0 fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --no-self-update
      - name: cargo clippy
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          log="$(mktemp)"
          set +e
          cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### cargo clippy diagnostics"
              grep -E '^(error|warning|[[:space:]]*-->)' "$log" | tail -n 80 || true
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < <(grep -E '^(error|warning|[[:space:]]*-->)' "$log" | tail -n 30 || true)
          fi
          exit "$status"

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: cargo build
        run: cargo +1.96.0 build --workspace --all-targets --locked
      - name: cargo test
        run: cargo +1.96.0 test --workspace --all-targets --locked
        env:
          # Loopback integration tests self-skip on PermissionDenied.
          RUST_BACKTRACE: 1

  demo:
    name: Reproducible demo
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: cargo build --locked
        run: cargo +1.96.0 build -p shph-cli --locked
      - name: run all demos
        run: ./scripts/demo.sh all

  fuzz-smoke:
    name: Fuzz harness smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-07-16 --profile minimal --no-self-update
      - name: Install cargo-fuzz
        run: cargo +1.96.0 install cargo-fuzz --version 0.13.2 --locked
      - name: Run one fuzzing iteration per target
        working-directory: fuzz
        run: |
          for target in frame_decode config_parse audit_record replay_window shroud2_datagram; do
            cargo +nightly-2026-07-16 fuzz run "$target" -- -runs=1
          done

  # Separate, clearly-scoped job for the experimental native TUN path on Linux.
  # Requires CAP_NET_ADMIN; guarded so it does not break the main matrix.
  linux-native-tun:
    name: Linux native TUN (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: build with native TUN path
        run: cargo +1.96.0 build -p shph-cli --locked
      - name: smoke (requires CAP_NET_ADMIN; may be skipped by host policy)
        run: SHPH_TUN_NATIVE=1 cargo test -p shph-tun
      - name: isolated namespace smoke (optional)
        run: ./scripts/native_tun_namespace_test.sh

  # Supply-chain advisory scan. The two currently accepted transitive TUI
  # advisories are ignored explicitly; any new warning or vulnerability fails.
  audit:
    name: cargo audit (advisory scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Install cargo-audit
        run: cargo +1.96.0 install cargo-audit --version 0.22.2 --locked
      - name: cargo audit
        run: >
          cargo audit
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0002
          --deny warnings
