# SHPH continuous integration: format, lint, build, and test on Linux + Windows.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --all-targets --locked
        env:
          # Loopback integration tests self-skip on PermissionDenied.
          RUST_BACKTRACE: 1

  demo:
    name: Reproducible demo
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --locked
        run: cargo build -p shph-cli --locked
      - name: run all demos
        run: ./scripts/demo.sh all

  fuzz-smoke:
    name: Fuzz harness smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run one fuzzing iteration per target
        working-directory: fuzz
        run: |
          for target in frame_decode config_parse audit_record replay_window; do
            cargo fuzz run "$target" -- -runs=1
          done

  # Separate, clearly-scoped job for the experimental native TUN path on Linux.
  # Requires CAP_NET_ADMIN; guarded so it does not break the main matrix.
  linux-native-tun:
    name: Linux native TUN (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build with native TUN path
        run: cargo build -p shph-cli --locked
      - name: smoke (requires CAP_NET_ADMIN; may be skipped by host policy)
        run: SHPH_TUN_NATIVE=1 cargo test -p shph-tun

  # Supply-chain advisory scan. The two currently accepted transitive TUI
  # advisories are ignored explicitly; any new warning or vulnerability fails.
  audit:
    name: cargo audit (advisory scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: >
          cargo audit
          --ignore RUSTSEC-2024-0436
          --ignore RUSTSEC-2026-0002
          --deny warnings
