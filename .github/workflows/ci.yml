# SHPH continuous integration: format, lint, build, and test on Linux + Windows.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
      - name: cargo fmt --check
        run: cargo +1.96.0 fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy --no-self-update
      - name: cargo clippy
        run: cargo +1.96.0 clippy --workspace --all-targets --locked -- -D warnings

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: cargo build
        run: cargo +1.96.0 build --workspace --all-targets --locked
      - name: cargo test
        run: cargo +1.96.0 test --workspace --all-targets --locked
        env:
          # Loopback integration tests self-skip on PermissionDenied.
          RUST_BACKTRACE: 1

  demo:
    name: Reproducible demo
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: cargo build --locked
        run: cargo +1.96.0 build -p shph-cli --locked
      - name: run all demos
        run: ./scripts/demo.sh all

  fuzz-smoke:
    name: Fuzz harness smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-07-16 --profile minimal --no-self-update
      - name: Install cargo-fuzz
        run: cargo +1.96.0 install cargo-fuzz --version 0.13.2 --locked
      - name: Run one fuzzing iteration per target
        working-directory: fuzz
        run: |
          for target in frame_decode config_parse audit_record replay_window shroud2_datagram; do
            cargo +nightly-2026-07-16 fuzz run "$target" -- -runs=1
          done

  standalone-validation:
    name: Standalone ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: benchmarks
            manifest: benchmarks/Cargo.toml
          - name: fuzz manifest
            manifest: fuzz/Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update
      - name: cargo fmt --check
        run: cargo +1.96.0 fmt --manifest-path "${{ matrix.manifest }}" -- --check
      - name: cargo check --locked
        run: cargo +1.96.0 check --manifest-path "${{ matrix.manifest }}" --all-targets --locked

  windows-benchmark-smoke:
    name: Windows benchmark smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Build standalone benchmark with MSVC
        run: cargo +1.96.0 build --release --manifest-path benchmarks/Cargo.toml --target x86_64-pc-windows-msvc --locked
      - name: Run identity benchmark smoke
        run: .\benchmarks\target\x86_64-pc-windows-msvc\release\shph-benchmarks.exe --suite identity --iterations 2 --frames 2
      - name: Run wire benchmark smoke
        run: .\benchmarks\target\x86_64-pc-windows-msvc\release\shph-benchmarks.exe --suite wire --iterations 2 --frames 2

  benchmark-linux:
    name: Full benchmark campaign (ubuntu-latest)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Build standalone benchmark runner
        run: cargo +1.96.0 build --release --manifest-path benchmarks/Cargo.toml --locked
      - name: Run complete local evidence suites
        shell: bash
        run: |
          set -euo pipefail
          output="benchmark-runs/github-ubuntu"
          mkdir -p "$output"
          binary="./benchmarks/target/release/shph-benchmarks"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "runner=ubuntu-latest"
            echo "rustc=$(rustc +1.96.0 --version)"
            echo "campaign=all+extended+criterion"
            echo "scope=GitHub-hosted local benchmark;not Internet or censorship evidence"
            echo "determinism=synthetic inputs and fixed seeds;OS-randomized padding may vary"
          } > "$output/metadata.txt"
          for profile in secure-default classical-lab; do
            "$binary" --profile "$profile" --suite all --iterations 100 --frames 10000 \
              > "$output/${profile}-all.csv"
            "$binary" --profile "$profile" --suite extended --iterations 100 --frames 10000 \
              > "$output/${profile}-extended.csv"
          done
      - name: Run Criterion microbenchmarks
        run: bash ./scripts/benchmark_criterion.sh ./benchmark-runs/github-ubuntu/criterion
      - name: Upload Ubuntu benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shph-benchmarks-ubuntu-${{ github.run_id }}
          path: benchmark-runs/github-ubuntu
          if-no-files-found: warn
          retention-days: 30

  benchmark-windows:
    name: Full benchmark campaign (windows-latest)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Build standalone benchmark runner with MSVC
        run: cargo +1.96.0 build --release --manifest-path benchmarks/Cargo.toml --target x86_64-pc-windows-msvc --locked
      - name: Run complete local evidence suites
        shell: pwsh
        run: |
          $binary = (Resolve-Path .\benchmarks\target\x86_64-pc-windows-msvc\release\shph-benchmarks.exe).Path
          & .\scripts\benchmark_windows.ps1 `
            -Binary $binary `
            -Suite all `
            -Iterations 100 `
            -Frames 10000 `
            -OutputDirectory .\benchmark-runs\github-windows\all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\scripts\benchmark_windows.ps1 `
            -Binary $binary `
            -Suite extended `
            -Iterations 100 `
            -Frames 10000 `
            -OutputDirectory .\benchmark-runs\github-windows\extended
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Criterion microbenchmarks
        shell: pwsh
        run: .\scripts\benchmark_criterion.ps1 -OutputDirectory .\benchmark-runs\github-windows\criterion
      - name: Upload Windows benchmark artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shph-benchmarks-windows-${{ github.run_id }}
          path: benchmark-runs/github-windows
          if-no-files-found: warn
          retention-days: 30

  # Separate, clearly-scoped job for the experimental native TUN path on Linux.
  # Native-TUN evidence is a release gate and must not be silently ignored.
  linux-native-tun:
    name: Linux native TUN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: build with native TUN path
        run: cargo +1.96.0 build -p shph-cli --locked
      - name: smoke (requires CAP_NET_ADMIN; reports host-policy skips)
        run: SHPH_TUN_NATIVE=1 cargo test -p shph-tun
      - name: isolated namespace smoke
        run: ./scripts/native_tun_namespace_test.sh

  # Supply-chain advisory scan. The current ratatui dependency graph no longer
  # contains the previously accepted paste/lru advisories, so warnings remain
  # blocking instead of being hidden by an exception list.
  audit:
    name: cargo audit (advisory scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update
      - name: Install cargo-audit
        run: cargo +1.96.0 install cargo-audit --version 0.22.2 --locked
      - name: cargo audit
        run: cargo audit --deny warnings
