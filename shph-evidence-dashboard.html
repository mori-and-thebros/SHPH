    (() =&gt; {
      const root = document.getElementById(&quot;shphEvidenceDashboard&quot;);
      const ns = &quot;http://www.w3.org/2000/svg&quot;;

      const make = (tag, attrs, parent) =&gt; {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
        parent.appendChild(node);
        return node;
      };

      const addText = (parent, attrs, value) =&gt; {
        const node = make(&quot;text&quot;, attrs, parent);
        node.textContent = value;
        return node;
      };

      const linearScale = (value, min, max, left, right) =&gt;
        left + ((value - min) / (max - min)) * (right - left);

      const format = (value, digits = 2) =&gt;
        Number(value).toLocaleString(&quot;en-US&quot;, {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        });

      const drawPanel = (parent, config) =&gt; {
