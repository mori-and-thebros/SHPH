[package]
name = "shph-benchmarks"
version = "0.6.7-dev"
edition = "2021"
publish = false

[workspace]

[[bench]]
name = "criterion"
harness = false

[dependencies]
hex = "0.4"
libc = "0.2"
serde_json = "1.0"
shph-core = { path = "../shph-core" }
shph-edge = { path = "../shph-edge", default-features = false }
shph-identity = { path = "../shph-identity" }
shph-obfuscation = { path = "../shph-obfuscation" }
shph-transport = { path = "../shph-transport" }
tokio = { version = "1.47", features = ["io-util", "rt", "time"] }

[dev-dependencies]
criterion = "0.8.2"
