[package]
name = "shph-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Command-line interface for SHPH VPN"
build = "build.rs"

[[bin]]
name = "shph"
path = "src/main.rs"

[dependencies]
shph-core = { path = "../shph-core" }
shph-config = { path = "../shph-config" }
shph-tun = { path = "../shph-tun" }
shph-transport = { path = "../shph-transport" }
shph-snap = { path = "../shph-snap" }
shph-obfuscation = { path = "../shph-obfuscation" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
qrcode = { workspace = true }
toml = { workspace = true }
libc = { workspace = true }
windows-sys = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
rcgen = "0.13"
futures-util = "0.3"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
