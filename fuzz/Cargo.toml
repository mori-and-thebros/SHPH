[package]
name = "shph-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
shph-config = { path = "../shph-config" }
shph-core = { path = "../shph-core" }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit_record"
path = "fuzz_targets/audit_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_window"
path = "fuzz_targets/replay_window.rs"
test = false
doc = false
bench = false

[workspace]
